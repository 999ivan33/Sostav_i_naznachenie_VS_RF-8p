  <style>
    /* =========================================================
       1. СБРОС И ЗАПРЕТ ВЫДЕЛЕНИЯ / ЗУМА
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 10%, rgba(2, 132, 199, 0.12), transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px, 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    /* =========================================================
       2. КАРКАС ИНТЕРФЕЙСА
       ========================================================= */
    .app-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: #0f141f;
      border: 1px solid #1e293b;
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .badge-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(2, 132, 199, 0.15);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(2, 132, 199, 0.35);
    }

    .counter-text {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: #172033;
      border-radius: 99px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.25s ease;
    }

    /* =========================================================
       3. ЗОНА ВОПРОСА
       ========================================================= */
    .question-zone {
      position: relative;
      min-height: 250px;
      display: flex;
      flex-direction: column;
    }

    .protected-box {
      filter: blur(18px);
      opacity: 0.12;
      transition: filter 0.1s ease, opacity 0.1s ease;
    }

    .protected-box.active-view {
      filter: blur(0);
      opacity: 1;
    }

    .question-heading {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      color: #f8fafc;
      margin-bottom: 14px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .option-item {
      background: #151c2c;
      border: 1px solid #222f48;
      border-radius: 9px;
      padding: 13px 14px;
      font-size: 13.5px;
      line-height: 1.35;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.1s ease, border-color 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .option-item.tapped {
      background: #0284c7 !important;
      border-color: #38bdf8 !important;
      color: #ffffff !important;
    }

    .option-letter {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: #222f48;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      flex-shrink: 0;
      pointer-events: none;
    }

    .option-text {
      pointer-events: none;
    }

    /* Сенсорная кнопка удержания */
    .hold-trigger {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    .hold-trigger.holding {
      background: #025a87;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.4);
    }

    /* Оверлей блокировки экрана */
    #blackout-shield {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 999999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;

    .blackout-title {

      font-weight: 800;
      color: #ef4444;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .blackout-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.45;
      max-width: 380px;
    }

    .screen-view { display: none; }
    .screen-view.current { display: block; }

    .result-content { text-align: center; padding: 12px 4px; }

    .mark-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      border: 3px solid;

    .mark-4 { color: #60a5fa; border-color: #60a5fa; background: rgba(96, 165, 250, 0.12); }
    .mark-3 { color: #facc15; border-color: #facc15; background: rgba(250, 204, 21, 0.12); }
    .mark-2 { color: #f87171; border-color: #f87171; background: rgba(248, 113, 113, 0.12); }

    .score-title { font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .score-percent { font-size: 13px; color: #94a3b8; margin-bottom: 14px; }

    .analysis-card {

      border: 1px solid #222f48;
      border-radius: 9px;
      padding: 13px;
      text-align: left;
      font-size: 13px;
      line-height: 1.45;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .action-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const sessionQuestions = shuffleArray(questionBank).slice(0, 20).map(item => {
  const shuffledOptions = shuffleArray(item.a);
  return {
    q: item.q,
    options: shuffledOptions,
    correctIdx: shuffledOptions.indexOf(item.correct)
  };
});

let currentStep = 0;
let score = 0;
let isHolding = false;
let isQuizFinished = false;
let questionBurned = false;
let holdTouchId = null;
let isAnswering = false;

const testScreen = document.getElementById("test-screen");
const resultScreen = document.getElementById("result-screen");
const blackoutShield = document.getElementById("blackout-shield");

const qCounter = document.getElementById("q-counter");
const pBar = document.getElementById("p-bar");
const qText = document.getElementById("q-text");
const optionsBox = document.getElementById("options-box");
const protectedWrap = document.getElementById("protected-wrap");
const holdBtn = document.getElementById("hold-btn");

/* =========================================================
   ЯДРО МУЛЬТИТАЧА (100% ПОДДЕРЖКА WEBVIEW И GITHUB PAGES)
   ========================================================= */
function startHolding(id) {
  if (isQuizFinished || questionBurned) return;
  holdTouchId = id;
  isHolding = true;
  protectedWrap.classList.add("active-view");
  holdBtn.classList.add("holding");
  holdBtn.textContent = "👀 ЧТЕНИЕ АКТИВНО (ВЫБЕРИТЕ ОТВЕТ)";
}

function stopHolding() {
  holdTouchId = null;
  isHolding = false;
  protectedWrap.classList.remove("active-view");
  holdBtn.classList.remove("holding");
  holdBtn.textContent = "👇 ЗАЖМИТЕ И УДЕРЖИВАЙТЕ ДЛЯ ЧТЕНИЯ";
}

// 1. Палец удержания (Touch API)
holdBtn.addEventListener("touchstart", (e) => {
  if (holdTouchId === null && e.changedTouches.length > 0) {
    startHolding(e.changedTouches[0].identifier);
  }
}, { passive: true });

// Мышь для ПК
holdBtn.addEventListener("mousedown", () => startHolding("mouse"));
window.addEventListener("mouseup", () => {
  if (holdTouchId === "mouse") stopHolding();
});

// Отслеживание отрыва пальца удержания в любом месте экрана
window.addEventListener("touchend", (e) => {
  if (holdTouchId !== null && holdTouchId !== "mouse") {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === holdTouchId) {
        stopHolding();
        break;
      }
    }
  }
}, { passive: true });

window.addEventListener("touchcancel", (e) => {
  if (holdTouchId !== null && holdTouchId !== "mouse") {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === holdTouchId) {
        stopHolding();
        break;
      }
    }
  }
}, { passive: true });

// 2. Второй палец: глобальный перехват координат в момент касания
window.addEventListener("touchstart", (e) => {
  if (isAnswering || isQuizFinished || questionBurned) return;

  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    // Если это палец удержания — пропускаем
    if (touch.identifier === holdTouchId) continue;

    // Ищем элемент под вторым пальцем через физические координаты
    const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
    if (!targetEl) continue;

    const card = targetEl.closest(".option-item");
    if (card) {
      const index = parseInt(card.dataset.index, 10);
      if (!isNaN(index)) {
        isAnswering = true;
        card.classList.add("tapped");
        setTimeout(() => pickAnswer(index), 80);
        break;
      }
    }
  }
}, { passive: true });

// Клик мышью для десктопа
optionsBox.addEventListener("click", (e) => {
  if (isAnswering || isQuizFinished || questionBurned) return;
  const card = e.target.closest(".option-item");
  if (!card) return;
  const index = parseInt(card.dataset.index, 10);
  if (!isNaN(index)) {
    isAnswering = true;
    card.classList.add("tapped");
    setTimeout(() => pickAnswer(index), 80);
  }
});

/* Отрисовка текущего вопроса */
function loadQuestion() {
  isAnswering = false;

  const data = sessionQuestions[currentStep];
  qCounter.textContent = `Вопрос ${currentStep + 1} из 20`;
  pBar.style.width = `${(currentStep / 20) * 100}%`;
  qText.textContent = data.q;

  optionsBox.innerHTML = "";
  const letters = ["А", "Б", "В", "Г"];

  data.options.forEach((optText, index) => {
    const card = document.createElement("div");
    card.className = "option-item";
    card.dataset.index = index;
    card.innerHTML = `
      <div class="option-letter">${letters[index]}</div>
      <div class="option-text">${optText}</div>
    `;
    optionsBox.appendChild(card);
  });
}

function pickAnswer(index) {
  if (isQuizFinished || questionBurned) return;

  const data = sessionQuestions[currentStep];
  if (index === data.correctIdx) {
    score++;
  }

  nextStep();
}

function nextStep() {
  currentStep++;
  if (currentStep < 20) {
    loadQuestion();
  } else {
    finishQuiz();
  }
}

/* =========================================================
   БЛЭКАУТ: ЗАЩИТА С ЗАДЕРЖКОЙ ДЛЯ QR-СКАНЕРОВ
   ========================================================= */
let isAppReady = false;
// 1500 мс задержки, чтобы WebView сканера QR-кода успел стабилизировать фокус
setTimeout(() => { isAppReady = true; }, 1500);

function triggerBlackout() {
  if (!isAppReady || isQuizFinished || questionBurned) return;

  questionBurned = true;
  stopHolding();

  blackoutShield.style.display = "flex";
  qText.textContent = "";
  optionsBox.innerHTML = "";
}

function handleFocusReturn() {
  if (!questionBurned) return;

  setTimeout(() => {
    blackoutShield.style.display = "none";
    questionBurned = false;
    nextStep();
  }, 1800);
}

// Защита от сворачивания и скриншотов
window.addEventListener("blur", triggerBlackout);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) triggerBlackout();
});
window.addEventListener("focus", handleFocusReturn);

window.addEventListener("keyup", (e) => {
  if (e.key === "PrintScreen") {
    triggerBlackout();
    handleFocusReturn();
  }
});
window.addEventListener("keydown", (e) => {
  if (e.key === "PrintScreen") {
    e.preventDefault();
    triggerBlackout();
    handleFocusReturn();
  }
  if (
    e.key === "F12" ||
    ((e.ctrlKey || e.metaKey) && ["c", "u", "s", "p", "a"].includes(e.key.toLowerCase())) ||
    ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i", "j", "c"].includes(e.key.toLowerCase()))
  ) {
    e.preventDefault();
    return false;
  }
});

document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("dragstart", (e) => e.preventDefault());

/* =========================================================
   ШКАЛА ОЦЕНОК (ОТ 15 ВЕРНЫХ - 4, МЕНЬШЕ 5 - 2)
   ========================================================= */
function finishQuiz() {
  isQuizFinished = true;
  stopHolding();
  testScreen.classList.remove("current");
  resultScreen.classList.add("current");

  const pct = Math.round((score / 20) * 100);
  document.getElementById("score-text").textContent = `${score} из 20 верно`;
  document.getElementById("percent-text").textContent = `${pct}% правильных ответов`;

  const markCircle = document.getElementById("mark-circle");
  const analysisText = document.getElementById("analysis-text");
  markCircle.className = "mark-circle";

  if (score >= 18) {
    markCircle.classList.add("mark-5");
    markCircle.textContent = "5";
    analysisText.innerHTML = "<strong>Блестящий результат!</strong> Вы безупречно ориентируетесь в структуре Вооруженных Сил РФ: знаете вертикаль высшего руководства, четко разделяете виды войск, стратегический резерв и задачи специальных подразделений.";
  } else if (score >= 15) {
    markCircle.classList.add("mark-4");
    markCircle.textContent = "4";
    analysisText.innerHTML = "<strong>Хороший уровень знаний.</strong> Основные уровни и задачи войск усвоены уверенно. Небольшие неточности связаны со специальными войсками обеспечения или расшифровкой аббревиатур.";
  } else if (score >= 5) {
    markCircle.classList.add("mark-3");
    markCircle.textContent = "3";
    analysisText.innerHTML = "<strong>Удовлетворительно.</strong> Базовый порог преодолен, но присутствует путаница между видами войск и отдельными родами войск (РВСН, ВДВ). Рекомендуется повторить инфографику.";
  } else {
    markCircle.classList.add("mark-2");
    markCircle.textContent = "2";
    analysisText.innerHTML = "<strong>Тема не освоена (порог не пройден).</strong> Менее 5 правильных ответов либо часть вопросов была аннулирована защитным экраном. Необходимо изучить материал заново.";
  }
}

// Запуск первой сессии
loadQuestion();
